modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/TunaMods/custom_glint/issues"

# --- Mixin configs (loaded for the whole jar) ---
[[mixins]]
config="custom_glint.mixins.json"
[[mixins]]
config="custom_glint.sophisticatedbackpacks.mixins.json"
[[mixins]]
config="custom_glint.elytraslot.mixins.json"

# --- API mod ---
[[mods]]
modId="customglint_api"
version="${mod_version}"
displayName="Custom Glints API"
authors="${mod_authors}"
description='''The rendering pipeline and API for Custom Glints. Other mods bundle this jar to give their own items animated, color-customizable enchantment glints.'''

# --- Full mod ---
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# --- Dependencies for the API mod ---
[[dependencies.customglint_api]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.customglint_api]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# --- Dependencies for the full mod ---
[[dependencies.${mod_id}]]
    modId="customglint_api"
    type="required"
    versionRange="[${mod_version},)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19.0,)"
    ordering="NONE"
    side="CLIENT"
