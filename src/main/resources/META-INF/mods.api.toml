modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mixins]]
config="custom_glint.mixins.json"

[[mods]]
modId="customglint_api"
version="${mod_version}"
displayName="Glint & Glamour API"
logoFile="customglint.png"
authors="${mod_authors}"
description='''The rendering pipeline and NBT API for Glint & Glamour. Other mods bundle this jar via jarJar to give their own items animated, color-customizable enchantment glints — without forcing players to install a separate dependency or exposing player-facing content (wand, creative tab, recipes, commands).'''

[[dependencies.customglint_api]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.customglint_api]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
